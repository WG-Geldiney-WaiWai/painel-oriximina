# Painel Oriximiná no Docker Desktop
#   Subir (e atualizar depois de mudar o código):  docker compose up -d --build
#   Abrir no navegador:                             http://localhost:8501
#   Parar:                                          docker compose down
#   Endereço https para o celular (GPS):            docker compose --profile celular up -d
#                                                   e depois rode .\link-celular.ps1 para ver o endereço
# Nome do grupo no Docker Desktop (separado do taipei-dashboard)
name: painel-oriximina

services:
  painel:
    build: .
    image: painel-oriximina
    container_name: painel-oriximina
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - TZ=America/Santarem
      # Chave do "Resumo com IA" (opcional): defina ANTHROPIC_API_KEY no Windows antes de subir
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Pasta dos arquivos baixados das fontes (Censo, CNEFE, RAIS, SENATRAN), usada pelo botão
      # "Atualizar" da administração: dentro do container ela fica em /fontes (ver volumes abaixo)
      - PASTA_FONTES=/fontes
      - PASTA_FONTES_PC=${PASTA_FONTES_PC:-C:\Users\Usuário\Downloads\Pasta Mapa de Painel Oriximiná}
    # Pastas que o painel altera (contas, favoritos, problemas reportados, componentes novos,
    # fotos de colaboradores, dados atualizados pela administração): ficam na pasta do
    # computador, então nada se perde ao recriar o container e o painel fora do Docker vê o mesmo
    volumes:
      - ./usuarios:/app/usuarios
      - ./dados:/app/dados
      - ./imagens:/app/imagens
      - ./static:/app/static
      - ./backups:/app/backups
      # A pasta de Downloads das fontes, fora do projeto. Com escrita: alguns scripts baixam arquivos
      # novos para ela (DATASUS, SENATRAN, GHSL). Em outro computador, defina PASTA_FONTES_PC antes de subir
      - type: bind
        source: ${PASTA_FONTES_PC:-C:\Users\Usuário\Downloads\Pasta Mapa de Painel Oriximiná}
        target: /fontes
        bind:
          create_host_path: true

  # Endereço https:// para abrir no celular (o GPS do navegador só funciona em https).
  # Túnel gratuito da Cloudflare: o endereço (https://....trycloudflare.com) é sorteado e MUDA
  # sempre que este container reinicia; veja o atual com .\link-celular.ps1.
  # Opcional (perfil "celular"): só liga com  docker compose --profile celular up -d
  # Quem tiver o endereço abre o painel pela internet, como pelo endereço da rede de casa.
  tunel:
    image: cloudflare/cloudflared:latest
    container_name: painel-oriximina-tunel
    # --metrics: o painel pergunta aqui (http://tunel:20241/quicktunnel) o endereço https atual,
    # para mostrar o link certo no aviso de localização do celular
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://painel:8501
    depends_on:
      - painel
    restart: unless-stopped
    profiles: ["celular"]
